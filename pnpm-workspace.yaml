allowBuilds:
  esbuild: false

# Only install package versions that have been public for at least 2 days.
minimumReleaseAge: 2880

# semver 6.3.2 and 7.8.6 were published on 2026-11-02. Pin the previous
# releases until the new ones age past the policy above.
overrides:
  semver@6: 6.3.1
  semver@7: 7.8.5
